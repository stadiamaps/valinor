[workspace]
resolver = "2"

members = [
    "bit-twiddling-helpers",
    "illuvatar-service",
    "valhalla-graphtile",
    "valhalla-microservice",
    "valhalla-proto",
    "valhalla-response",
    "valinor-cli",
    "valinor-export-graph",
]

[workspace.package]
authors = [
    "Ian Wagner <ian@stadiamaps.com>",
]
license = "BSD-3-Clause"
edition = "2024"
repository = "https://github.com/stadiamaps/valinor"
rust-version = "1.92.0"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bitfield-struct = "0.13.0"
bit-twiddling-helpers = { path = "bit-twiddling-helpers" }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
dashmap = "6.2.1"
enumset = "1.1.15"
flatgeobuf = { version = "6.0.1", default-features = false }
geo = "0.33.1"
geozero = "0.15.1"
http = "1.5.0"
indicatif = "0.18.6"
insta = { version = "1.49.0", features = ["yaml"] }
integer-encoding = "4.1.0"
itertools = "0.15.0"
lru = "0.19.0"
memmap2 = "0.9.12"
num-traits = "0.2.19"
num_enum = "0.7.6"
nutype = { version = "0.8.0" }
proptest = "1.12.0"
prost = "0.14.4"
prost-build = "0.14.4"
protobuf-src = "2.1.1"
protoc-bin-vendored = "3.3.0"
rand = "0.10.3"
self_cell = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
serde_json = "1.0.154"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trig-const = "0.4.1"
valhalla-graphtile = { path = "valhalla-graphtile" }
valhalla-proto = { path = "valhalla-proto" }
valhalla-microservice = { path = "valhalla-microservice" }
valhalla-response = { path = "valhalla-response" }
walkdir = "2.5.0"
zerocopy = "0.8.63"
zerocopy-derive = "0.8.63"
zeromq = "0.7.0"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[profile.release]
lto = "thin"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
missing_errors_doc = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
