name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# Keep the QEMU and Miri runs in separate jobs.
# Together they take more than the 6-hour job limit of GitHub Actions.
jobs:
  fmt:
    name: Check formatting

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Check formatting
      run: cargo fmt --check

  test:
    name: Test (${{ matrix.os }})

    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - uses: taiki-e/install-action@nextest

    - name: Build workspace
      run: cargo build --verbose

    - name: Run tests
      run: cargo nextest run --no-fail-fast

    - name: Run doc tests (not currently supported by nextest https://github.com/nextest-rs/nextest/issues/16)
      run: cargo test --doc

    - name: Build valhalla-graphtile in isolation (default feature flags)
      run: cargo build -p valhalla-graphtile

    - name: Build valhalla-graphtile in isolation (optional features)
      run: cargo build -p valhalla-graphtile --features serde

  big-endian:
    name: Test (big-endian s390x)

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: taiki-e/install-action@nextest

    - name: Install big-endian toolchain (s390x)
      run: rustup target add s390x-unknown-linux-gnu

    # .cargo/config.toml uses these packages as the s390x linker and test runner.
    - name: Install s390x cross toolchain and QEMU
      run: sudo apt-get update && sudo apt-get install -y gcc-s390x-linux-gnu g++-s390x-linux-gnu libc6-dev-s390x-cross qemu-user-static

    - name: Run tests (big-endian s390x)
      run: cargo nextest run --no-fail-fast --target s390x-unknown-linux-gnu

  miri:
    name: Miri (${{ matrix.name }})

    runs-on: ubuntu-latest

    strategy:
      # Each leg runs for hours.
      # A failure in one leg must not cancel the other leg.
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target: x86_64-unknown-linux-gnu
            doc-tests: true
          # Miri interprets the target, so this leg needs no cross toolchain or QEMU.
          - name: big-endian s390x
            target: s390x-unknown-linux-gnu
            doc-tests: false

    env:
      RUST_BACKTRACE: 1
      MIRIFLAGS: -Zmiri-disable-isolation

    steps:
    - uses: actions/checkout@v6
    - uses: taiki-e/install-action@nextest

    - name: Install Miri
      run: rustup +nightly component add miri

    - name: Install nightly target (${{ matrix.target }})
      run: rustup +nightly target add ${{ matrix.target }}

    - name: Run tests in Miri
      run: cargo +nightly miri nextest run --no-fail-fast --target ${{ matrix.target }}

    - name: Run doc tests in Miri
      if: matrix.doc-tests
      run: cargo +nightly miri test --doc
